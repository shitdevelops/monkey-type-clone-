<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">typetest</h1>
    <nav class="theme-switcher">
      <button data-theme="night">night</button>
      <button data-theme="paper">paper</button>
      <button data-theme="forest">forest</button>
    </nav>
  </header>

  <main>
    <!-- Everything the user sees while taking the test -->
    <div class="test-view" id="test-view">
      <div class="modes" id="modes">
        <button class="mode active" data-time="15">15</button>
        <button class="mode" data-time="30">30</button>
        <button class="mode" data-time="60">60</button>
      </div>

      <div class="live">
        <span id="timer">15</span>
      </div>

      <!-- Typing area: JS fills #words with .word > .letter elements -->
      <section class="test" id="test">
        <div class="caret" id="caret"></div>
        <div class="words" id="words"></div>
      </section>

      <p class="hint" id="hint">start typing to begin</p>

      <button class="restart" id="restart" title="Restart (Tab)">restart</button>
    </div>

    <!-- Shown only after the test ends (body gets the "finished" class) -->
    <section class="results" id="results">
      <div class="stats">
        <div class="stat"><span class="stat-label">wpm</span><span class="stat-value" id="res-wpm">0</span></div>
        <div class="stat"><span class="stat-label">accuracy</span><span class="stat-value" id="res-acc">0%</span></div>
        <div class="stat"><span class="stat-label">characters</span><span class="stat-value" id="res-chars">0/0</span></div>
        <div class="stat"><span class="stat-label">best</span><span class="stat-value" id="res-best">0</span></div>
      </div>

      <div class="chart-box"><canvas id="wpm-chart"></canvas></div>

      <button class="again" id="again">next test</button>
      <p class="results-hint"><kbd>tab</kbd> next test</p>
    </section>
  </main>

  <footer class="footer">
    <span><kbd>tab</kbd> restart</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
